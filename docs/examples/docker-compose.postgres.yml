# Opt-in Postgres instead of the SQLite file (#1635). Use it on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# Postgres stays on the stack's own network and publishes no port, so only the backend can reach it.
# Set POSTGRES_PASSWORD in .env (letters and digits only, since it is part of DATABASE_URL).
# A fresh database starts empty: see "Moving from SQLite" in docs/deployment.md.

services:
  backend:
    environment:
      - DATABASE_URL=postgres://vroom:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vroom
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6-alpine
    container_name: vroom-postgres
    environment:
      - POSTGRES_USER=vroom
      - POSTGRES_DB=vroom
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - vroom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vroom -d vroom"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - vroom-network

volumes:
  vroom-postgres:
