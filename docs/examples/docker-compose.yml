# Docker Compose configuration for VROOM Car Tracker
# Production environment with optimized builds
version: '3.8'

services:
  # Backend service with Bun (production)
  backend:
    image: ghcr.io/onlyonebyte/vroom/backend:latest
    container_name: vroom-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      # Persistent database storage
      - vroom-data:/app/data
    # The container sees only what this block passes through, so a value in `.env` that is
    # missing here never reaches the backend. The three it refuses to start without in
    # production are GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and PROVIDER_ENCRYPTION_KEY.
    # Optional features (GitHub login, web push, TRUSTED_PROXY_IPS) need their own lines here;
    # see docs/deployment.md.
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=/app/data/vroom.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - PROVIDER_ENCRYPTION_KEY=${PROVIDER_ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vroom-network
    labels:
      - "io.portainer.accesscontrol.teams=vroom"

  # Frontend service with SvelteKit (production)
  frontend:
    image: ghcr.io/onlyonebyte/vroom/frontend:latest
    container_name: vroom-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_API_URL=${PUBLIC_API_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vroom-network
    labels:
      - "io.portainer.accesscontrol.teams=vroom"

  # Cloudflare Tunnel for secure public access (free HTTPS, no port forwarding).
  # Delete this service if you are not using a tunnel — with an empty TUNNEL_TOKEN the
  # container exits on start and is restarted forever.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vroom-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - vroom-network
volumes:
  vroom-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}

networks:
  vroom-network:
    driver: bridge
