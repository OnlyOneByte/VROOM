name: Throwaway A/B web vitals (#1656)

on:
  push:
    branches: [crew/vroom-bot/ab-modulepreload]

jobs:
  ab:
    name: A/B, ${{ matrix.latency }} ms latency (${{ matrix.runner }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: 1, latency: 0 }
          - { runner: 2, latency: 0 }
          - { runner: 3, latency: 150 }
    permissions:
      contents: read
    env:
      DATABASE_URL: ./data/web-vitals.db
      PORT: 3001
      HOST: 127.0.0.1
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
      DISABLE_RATE_LIMIT: "true"
      LOG_LEVEL: warn
      B_REF: origin/crew/vroom-bot/vehicle-tbt-2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keep the A/B script, then check out main
        run: |
          cp frontend/scripts/ab-vitals.mjs "$RUNNER_TEMP/ab-vitals.mjs"
          git checkout --detach origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          (cd backend && bun install --frozen-lockfile)
          (cd frontend && npm ci)
      - name: Seed the database
        working-directory: ./backend
        run: |
          bun run db:seed
          bun ../frontend/scripts/web-vitals-seed.mjs > "$RUNNER_TEMP/seed.json"
          echo "VITALS_SESSION=$(jq -r .session "$RUNNER_TEMP/seed.json")" >> "$GITHUB_ENV"
          echo "VITALS_VEHICLE_ID=$(jq -r .vehicleId "$RUNNER_TEMP/seed.json")" >> "$GITHUB_ENV"
      - name: Build A (main) and B (the variant branch's frontend)
        working-directory: ./frontend
        run: |
          npm run build && mv build build-a
          git checkout "$B_REF" -- .
          git log -1 --format='B frontend from %H' "$B_REF"
          npm run build && mv build build-b
      - name: Start the backend and both frontends
        run: |
          (cd backend && nohup bun src/index.ts > "$RUNNER_TEMP/backend.log" 2>&1 &)
          (cd frontend && PORT=4173 PUBLIC_API_URL=http://127.0.0.1:3001 nohup node build-a > "$RUNNER_TEMP/fe-a.log" 2>&1 &)
          (cd frontend && PORT=4174 PUBLIC_API_URL=http://127.0.0.1:3001 nohup node build-b > "$RUNNER_TEMP/fe-b.log" 2>&1 &)
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS -o /dev/null http://127.0.0.1:3001/api/v1/auth/me -b "auth_session=$VITALS_SESSION"
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS -o /dev/null http://127.0.0.1:4173/auth
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS -o /dev/null http://127.0.0.1:4174/auth
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Measure interleaved rounds
        working-directory: ./frontend
        env:
          AB_PAIRS: "7"
          AB_LATENCY: ${{ matrix.latency }}
          AB_SERVERS: A:4173,B:4174
          AB_LABEL: A = main, B = cached time-zone and drum formatters.
        run: |
          cp "$RUNNER_TEMP/ab-vitals.mjs" scripts/ab-vitals.mjs
          node scripts/ab-vitals.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ab-vitals-${{ matrix.runner }}
          path: |
            frontend/ab-vitals.json
            frontend/ab-vitals.md
          retention-days: 7
