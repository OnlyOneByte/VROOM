name: Coverage Badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    name: Generate Coverage Badges
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # --- Frontend coverage ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Same single source of truth as ci-cd.yml, so the two jobs cannot resolve different
          # 22.x releases and disagree about whether the lockfile installs.
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Prepare SvelteKit
        working-directory: ./frontend
        # NOT `npm run prepare`: that script is `svelte-kit sync || echo ''` so npm's install
        # lifecycle tolerates a missing svelte-kit, and the `|| echo ''` swallows a failed sync.
        # `npm run sync` is the same command without the tolerance.
        run: npm run sync

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npx vitest --run --coverage

      # --- Backend coverage ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install backend dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile

      - name: Generate Drizzle types
        working-directory: ./backend
        run: bun run db:generate

      - name: Run backend tests with coverage
        working-directory: ./backend
        # `shell: bash` for its `pipefail`, which the default `bash -e` does not set: the step's
        # status would otherwise be `tee`'s, so a red suite would publish a badge measured from
        # a run nobody was told had failed.
        shell: bash
        run: |
          bun test --coverage 2>&1 | tee coverage-output.txt

      # --- Generate badge JSON files ---
      - name: Generate badge data
        run: |
          mkdir -p .badges

          # Frontend: read from vitest json-summary
          if [ -f frontend/coverage/coverage-summary.json ]; then
            FE_PCT=$(node -e "
              const data = require('./frontend/coverage/coverage-summary.json');
              const t = data.total;
              const avg = (t.lines.pct + t.statements.pct + t.functions.pct + t.branches.pct) / 4;
              console.log(Math.round(avg * 10) / 10);
            ")
          else
            FE_PCT="0"
          fi

          # Backend: parse bun coverage text output
          if [ -f backend/coverage-output.txt ]; then
            BE_PCT=$(grep "^All files" backend/coverage-output.txt | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          else
            BE_PCT="0"
          fi

          # A table bun no longer prints in this shape yields an empty match, which would render
          # as a bare "%" badge. Say so and fall back to the same 0 the missing-file branch uses.
          if ! printf '%s' "$BE_PCT" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::warning::could not parse backend coverage from backend/coverage-output.txt"
            BE_PCT="0"
          fi

          # Color based on percentage
          get_color() {
            local pct=$1
            local int_pct=$(echo "$pct" | awk '{printf "%d", $1}')
            if [ "$int_pct" -ge 80 ]; then echo "brightgreen"
            elif [ "$int_pct" -ge 60 ]; then echo "green"
            elif [ "$int_pct" -ge 40 ]; then echo "yellowgreen"
            elif [ "$int_pct" -ge 20 ]; then echo "orange"
            else echo "red"
            fi
          }

          FE_COLOR=$(get_color "$FE_PCT")
          BE_COLOR=$(get_color "$BE_PCT")

          # Write shields.io endpoint JSON
          echo "{\"schemaVersion\":1,\"label\":\"frontend coverage\",\"message\":\"${FE_PCT}%\",\"color\":\"${FE_COLOR}\"}" > .badges/frontend-coverage.json
          echo "{\"schemaVersion\":1,\"label\":\"backend coverage\",\"message\":\"${BE_PCT}%\",\"color\":\"${BE_COLOR}\"}" > .badges/backend-coverage.json

          echo "Frontend: ${FE_PCT}% (${FE_COLOR})"
          echo "Backend: ${BE_PCT}% (${BE_COLOR})"

      - name: Deploy badges to coverage-badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy badges to temp location
          cp -r .badges /tmp/badges

          # Switch to orphan branch. Nothing here reads the remote branch — the badge files are
          # rebuilt from scratch and force-pushed — so there is no fetch whose failure to excuse.
          git checkout --orphan coverage-badges-tmp

          # Clean and add only badge files. `--ignore-unmatch` tolerates exactly the expected
          # miss (an already-empty tree) instead of `|| true` swallowing every other git error.
          git rm -r -f --ignore-unmatch .
          cp -r /tmp/badges/* .
          git add frontend-coverage.json backend-coverage.json

          git commit -m "Update coverage badges [skip ci]"
          git push origin HEAD:coverage-badges --force
