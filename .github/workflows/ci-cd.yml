name: VROOM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # Backend testing and validation
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate code
        run: bun run type-check && bun run check

      - name: Run unit tests
        run: bun test

      - name: Build application
        run: bun run build

  # Frontend testing and validation
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Single source of truth, shared with local dev. `node-version: '22'` resolved to the
          # latest 22.x, which silently satisfied the lockfile's `^22.22.2` floor while a
          # developer on an older 22.x could not install at all.
          node-version-file: .nvmrc

      - name: Install dependencies
        # Must be `npm ci`, never `npm install`: re-resolving the lockfile changes which
        # @rolldown/binding-* platform package is installed, and the WASM fallback parser
        # fails on TypeScript optional parameters in .svelte files.
        run: npm ci

      - name: Prepare SvelteKit
        # NOT `npm run prepare`: that script is `svelte-kit sync || echo ''`, because npm runs
        # `prepare` as an install lifecycle script where svelte-kit may be absent (e.g.
        # --omit=dev), and the `|| echo ''` swallows a failed sync. `npm run sync` is the same
        # command without the tolerance, so a broken sync fails the job here.
        run: npm run sync

      - name: Run type checking
        # Guarded by frontend/scripts/type-check.mjs (svelte-check is fail-open in two ways;
        # see that file). Keep this a plain script call so CI, the git hook, `validate`, and
        # local runs are all covered by the same guard.
        run: npm run type-check

      - name: Type check the E2E harness
        # The app's program comes from the SvelteKit-generated include list, which covers src/
        # only — e2e/ and playwright.config.ts compile under nothing without their own project.
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        # Chromium only. The suite declares five projects (two of them mobile viewports) and
        # runs at `workers: 1` under CI, so the full matrix costs roughly 5x; chromium catches
        # the regressions these specs are about — the a11y ratchet, the offline outbox drain,
        # delete-confirms-before-DELETE, server-side search — at a fifth of the runtime. The
        # engine-specific and mobile-viewport projects stay a local/pre-release concern.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # Sequential, after the build, NOT in parallel with type-check or vitest: those run
        # `svelte-kit sync`, which rewrites .svelte-kit/generated/ and makes the dev server
        # force-reload every open page, aborting in-flight navigations (see
        # playwright.config.ts). The dev target needs no backend and no database — every
        # /api/v1 call is mocked in-browser.
        run: npm run test:e2e:chromium

      - name: Upload Playwright report
        # The axe scans attach their full violation JSON to the report; without this the
        # report dies with the runner and a red a11y gate says only "expected [] to equal".
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Build and push Docker images
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
      || github.event_name == 'release'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: frontend-test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
      || github.event_name == 'release'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Trigger deployment for self-hosted environments
  deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'release'

    steps:
      - name: Trigger deployment webhook
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "event": "deployment",
                "repository": "${{ github.repository }}",
                "branch": "${{ github.ref_name }}",
                "commit": "${{ github.sha }}",
                "actor": "${{ github.actor }}"
              }'
          else
            echo "ℹ️  DEPLOY_WEBHOOK_URL not configured, skipping webhook"
          fi

      - name: Deployment notification
        run: |
          echo "✅ Docker images built and pushed successfully"
          echo "Backend: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"
          echo ""
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "🚀 Deployment webhook triggered"
          else
            echo "ℹ️  No deployment webhook configured (DEPLOY_WEBHOOK_URL secret not set)"
            echo "To enable automatic deployment, add DEPLOY_WEBHOOK_URL to repository secrets"
          fi
