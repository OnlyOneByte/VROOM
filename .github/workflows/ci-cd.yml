name: VROOM CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  release:
    types: [published]
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Pushes and dispatches share one group per ref
# without cancel-in-progress: the running run finishes, and GitHub keeps only the newest pending
# run per group, so a backlog on main collapses to its latest commit. A release gets a group of
# its own keyed on the run id, so a release build is never replaced. A merge-queue run has its
# own gh-readonly-queue ref, so it gets a group of its own and a PR push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'release' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate code
        run: bun run type-check && bun run check

      - name: Run unit tests
        run: bun run test

      - name: Build application
        run: bun run build

  backend-postgres:
    # Optional: never a required check. It runs the raw SQL captured on SQLite against Postgres
    # (PGlite, in process) so each bring-your-own-SQL step proves itself; see #1634.
    name: Backend Tests (Postgres, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the Postgres portability suite
        run: bun run test:postgres

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      images: ${{ steps.diff.outputs.images }}
      quarantined: ${{ steps.tagged.outputs.found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Does the change touch anything outside backend/?
        # A backend-only change cannot change what the E2E suite tests: it mocks every /api/v1
        # call. The unit tests always run, since several of them read backend/src to keep the two
        # sides in step. Anything else, and any event without a known base, runs E2E too.
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) base="$QUEUE_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base= ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qv '^backend/'; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi
          # The images are otherwise built only on main, so a broken Dockerfile would surface there.
          if echo "$files" | grep -qE '^((backend|frontend)/(Dockerfile|\.dockerignore|package(-lock)?\.json|bun\.lock|\.npmrc)|\.github/workflows/ci-cd\.yml)$'; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Any quarantined tests?
        # Quarantined E2E only starts when a test carries the tag, so it costs no runner otherwise.
        id: tagged
        run: |
          if grep -rqs '@quarantine' frontend/e2e; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No test is tagged @quarantine."
          fi

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Single source of truth, shared with local dev. `node-version: '22'` resolved to the
          # latest 22.x, which silently satisfied the lockfile's `^22.22.2` floor while a
          # developer on an older 22.x could not install at all.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Must be `npm ci`, never `npm install`: re-resolving the lockfile changes which
        # @rolldown/binding-* platform package is installed, and the WASM fallback parser
        # fails on TypeScript optional parameters in .svelte files.
        run: npm ci

      - name: Prepare SvelteKit
        # NOT `npm run prepare`: that script is `svelte-kit sync || echo ''`, because npm runs
        # `prepare` as an install lifecycle script where svelte-kit may be absent (e.g.
        # --omit=dev), and the `|| echo ''` swallows a failed sync. `npm run sync` is the same
        # command without the tolerance, so a broken sync fails the job here.
        run: npm run sync

      - name: Run type checking
        # Guarded by frontend/scripts/type-check.mjs (svelte-check is fail-open in two ways;
        # see that file). Keep this a plain script call so CI, the git hook, `validate`, and
        # local runs are all covered by the same guard.
        run: npm run type-check

      - name: Type check the E2E harness
        # The app's program comes from the SvelteKit-generated include list, which covers src/
        # only — e2e/ and playwright.config.ts compile under nothing without their own project.
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: Run linting
        run: npm run lint

      - name: Run the time-zone tests
        run: npm run test:tz

      - name: Build application
        run: npm run build

      - name: Check per-route bundle budgets
        run: npm run bundle-budget

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        # Chromium only; see the E2E job. A cache hit still needs the system libraries.
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run preview-only E2E tests (service worker, manifest, offline reload)
        env:
          E2E_TARGET: preview
        run: npx playwright test --project=chromium --grep "PWA surface|Opening the app offline|Security headers" --grep-invert @quarantine

      - name: List tests that passed only on retry
        if: ${{ !cancelled() }}
        run: node scripts/e2e-retry-report.mjs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-preview
          path: frontend/playwright-report/
          retention-days: 7

  frontend-unit:
    name: Frontend unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare SvelteKit
        run: npm run sync

      - name: Run this shard with coverage
        # A shard covers half the code, so the thresholds are checked once, on the merged
        # coverage, in Frontend Tests. The dot reporter names any failing test in this log;
        # the blob report feeds the merged coverage.
        run: >-
          npx vitest run --shard=${{ matrix.shard }}/2 --reporter=dot --reporter=blob --coverage
          --coverage.reporter=text-summary
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0

      - name: Upload the shard's report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  frontend-e2e:
    name: Frontend E2E (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare SvelteKit
        run: npm run sync

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        # Chromium only. The suite declares five projects (two of them mobile viewports) and
        # runs at `workers: 1` under CI, so the full matrix costs roughly 5x; chromium catches
        # the regressions these specs are about — the a11y ratchet, the offline outbox drain,
        # delete-confirms-before-DELETE, server-side search — at a fifth of the runtime. The
        # engine-specific and mobile-viewport projects stay a local/pre-release concern. A cache
        # hit still needs the system libraries.
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run E2E tests
        # The dev target needs no backend and no database — every /api/v1 call is mocked
        # in-browser. Each shard runs half the chromium tests. Quarantined tests run in
        # Quarantined E2E instead (docs/conventions/Flaky-Tests.md).
        run: npm run test:e2e:chromium -- --shard=${{ matrix.shard }}/2 --grep-invert @quarantine

      - name: List tests that passed only on retry
        if: ${{ !cancelled() }}
        run: node scripts/e2e-retry-report.mjs

      - name: Upload Playwright report
        # The axe scans attach their full violation JSON to the report; without this the
        # report dies with the runner and a red a11y gate says only "expected [] to equal".
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

  frontend-e2e-quarantine:
    # Not a required check: it runs the tests tagged @quarantine so a fix can be seen working
    # before the tag comes off (docs/conventions/Flaky-Tests.md).
    name: Quarantined E2E
    needs: changes
    if: needs.changes.outputs.quarantined == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare SvelteKit
        run: npm run sync

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run the quarantined tests
        run: npm run test:e2e:chromium -- --grep @quarantine --pass-with-no-tests

      - name: List tests that passed only on retry
        if: ${{ !cancelled() }}
        run: node scripts/e2e-retry-report.mjs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-quarantine
          path: frontend/playwright-report/
          retention-days: 7

  frontend-test:
    # The required check. It passes when every frontend job passed, with E2E allowed to be
    # skipped on a backend-only change, and the merged unit-test coverage meets the thresholds
    # in vite.config.ts; anything else fails it.
    name: Frontend Tests
    needs: [changes, frontend-checks, frontend-unit, frontend-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check the frontend jobs
        working-directory: .
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          E2E: ${{ needs.frontend-e2e.result }}
          RESULTS: ${{ needs.frontend-checks.result }} ${{ needs.frontend-unit.result }}
        run: |
          for result in $CHANGES $RESULTS; do
            if [ "$result" != success ]; then
              echo "Detect changes: $CHANGES. Checks, unit tests: $RESULTS."
              exit 1
            fi
          done
          if [ "$E2E" = success ]; then
            echo "Every frontend job passed."
          elif [ "$E2E" = skipped ] && [ "$FRONTEND" = false ]; then
            echo "Backend-only change: E2E was skipped; every other frontend job passed."
          else
            echo "Frontend E2E: $E2E"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest/blob
          merge-multiple: true

      - name: Merge the shards and check the coverage thresholds
        run: npx vitest --merge-reports=.vitest/blob --coverage

  web-vitals:
    name: Web Vitals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ./data/web-vitals.db
      PORT: 3001
      HOST: 127.0.0.1
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173
      DISABLE_RATE_LIMIT: "true"
      LOG_LEVEL: warn

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          (cd backend && bun install --frozen-lockfile)
          (cd frontend && npm ci)

      - name: Seed the database
        working-directory: ./backend
        run: |
          bun run db:seed
          bun ../frontend/scripts/web-vitals-seed.mjs > "$RUNNER_TEMP/web-vitals-seed.json"
          echo "VITALS_SESSION=$(jq -r .session "$RUNNER_TEMP/web-vitals-seed.json")" >> "$GITHUB_ENV"
          echo "VITALS_VEHICLE_ID=$(jq -r .vehicleId "$RUNNER_TEMP/web-vitals-seed.json")" >> "$GITHUB_ENV"

      - name: Build the frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start the backend and the built frontend
        run: |
          (cd backend && nohup bun src/index.ts > "$RUNNER_TEMP/backend.log" 2>&1 &)
          (cd frontend && PORT=4173 PUBLIC_API_URL=http://127.0.0.1:3001 nohup node build > "$RUNNER_TEMP/frontend.log" 2>&1 &)
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS -o /dev/null http://127.0.0.1:3001/api/v1/auth/me -b "auth_session=$VITALS_SESSION"
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS -o /dev/null http://127.0.0.1:4173/auth

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Measure the six key routes
        working-directory: ./frontend
        env:
          VITALS_BASE_URL: http://127.0.0.1:4173
        run: npm run web-vitals

      - name: Upload web vitals report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-vitals
          path: |
            frontend/test-results/web-vitals/
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          retention-days: 14

  check-images:
    name: Check ${{ matrix.image }} image builds
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      && needs.changes.outputs.images == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without pushing
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: vroom-${{ matrix.image }}:check
          cache-from: type=gha,scope=${{ matrix.image }}-amd64

      - name: Check the frontend image passes its healthcheck and ships no package manager
        if: matrix.image == 'frontend'
        run: |
          docker run --rm vroom-frontend:check sh -c '! command -v npm && ! command -v npx && ! command -v yarn && ! command -v corepack'
          docker run -d --name frontend-check vroom-frontend:check
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' frontend-check)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker logs frontend-check
          echo "frontend container status: $status"
          exit 1

      - name: Check the backend image starts its runtime
        if: matrix.image == 'backend'
        run: docker run --rm vroom-backend:check bun -e "process.exit(0)"

      - name: List fixable high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vroom-${{ matrix.image }}:check
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  build-images:
    name: Build ${{ matrix.image }} image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [backend-test, frontend-test]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Name the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Check the image runs on ${{ matrix.arch }}
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          RUNTIME: ${{ matrix.image == 'backend' && 'bun' || 'node' }}
          ARCH: ${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
        run: docker run --rm "$REF" "$RUNTIME" -e "if (process.arch !== '$ARCH') process.exit(1)"

      # Pinned by commit, not tag: this action's tags were once rewritten in a supply-chain attack.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload the scan to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: image-${{ matrix.image }}-${{ matrix.arch }}

      # Runs before the digest is recorded, so a fixable critical issue publishes no tag.
      - name: Fail on fixable critical issues
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: Publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]

    steps:
      - name: Name the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Check both platforms are published
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > manifest.json
          for platform in linux/amd64 linux/arm64; do
            jq -e --arg p "$platform" \
              '[.manifests[] | select(.platform != null) | "\(.platform.os)/\(.platform.architecture)"] | index($p)' \
              manifest.json > /dev/null || { echo "missing $platform in $tag"; exit 1; }
          done

  deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'release'

    steps:
      - name: Trigger deployment webhook
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "event": "deployment",
                "repository": "${{ github.repository }}",
                "branch": "${{ github.ref_name }}",
                "commit": "${{ github.sha }}",
                "actor": "${{ github.actor }}"
              }'
          else
            echo "ℹ️  DEPLOY_WEBHOOK_URL not configured, skipping webhook"
          fi

      - name: Deployment notification
        run: |
          echo "✅ Docker images built and pushed successfully"
          echo "Backend: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"
          echo ""
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "🚀 Deployment webhook triggered"
          else
            echo "ℹ️  No deployment webhook configured (DEPLOY_WEBHOOK_URL secret not set)"
            echo "To enable automatic deployment, add DEPLOY_WEBHOOK_URL to repository secrets"
          fi
