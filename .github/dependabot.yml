version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "bun"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"

  # The base images (oven/bun, node). node floats within a major, so every build pulls the latest
  # patch and this opens a PR for a new major. oven/bun is pinned to the CI version (#1972).
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    ignore:
      # Bun 1.4.x fails backend tests; lift this once #1972 is fixed.
      - dependency-name: "oven/bun"
        versions: [">= 1.4.0"]
      # Odd Node majors never become LTS.
      - dependency-name: "node"
        versions: ["~> 23.0", "~> 25.0", "~> 27.0"]
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
